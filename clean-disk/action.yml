name: 'QIIME 2 Library Packaging - Clean Disk'
description: 'Clean the workers disk of unneeded packages (linux only)'

runs:
  using: composite
  steps:
    - id: 'storage'
      shell: bash
      run: |
        echo "Available storage:"
        df -h

    - id: 'remove'
      if: ${{ runner.os == 'Linux' }}
      name: 'Remove unneeded packages'
      shell: bash
      run: |
        set -euo pipefail

        trap 'echo "::group::APT debug"; \
              sudo tail -n 200 /var/log/apt/term.log 2>/dev/null || true; \
              sudo tail -n 200 /var/log/apt/history.log 2>/dev/null || true; \
              sudo dpkg --audit || true; \
              echo "::endgroup::"' ERR

        sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
        sudo rm -rf \
          /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
          /usr/lib/jvm /opt/hostedtoolcache/CodeQL || true

        sudo apt-get update -y

        sudo dpkg --configure -a || true
        sudo apt-get -f install -y || true

        sudo apt-get purge -y \
          aria2 ansible azure-cli shellcheck rpm xorriso zsync \
          esl-erlang firefox gfortran-8 gfortran-9 google-chrome-stable \
          google-cloud-sdk imagemagick \
          libmagickcore-dev libmagickwand-dev libmagic-dev ant ant-optional kubectl \
          mercurial mono-complete libmysqlclient \
          unixodbc-dev yarn chrpath libssl-dev libxft-dev \
          libfreetype6 libfreetype6-dev libfontconfig1 libfontconfig1-dev \
          snmp pollinate libpq-dev postgresql-client powershell ruby-full \
          sphinxsearch subversion mongodb-org microsoft-edge-stable || true

        sudo apt-get purge -y $(dpkg-query -W -f='${Package}\n' 'mysql*' 2>/dev/null || true) || true
        sudo apt-get purge -y $(dpkg-query -W -f='${Package}\n' 'php*' 2>/dev/null || true) || true
        sudo apt-get purge -y $(dpkg-query -W -f='${Package}\n' 'dotnet*' 2>/dev/null || true) || true

        sudo apt-get autoremove -y
        sudo apt-get autoclean -y

    - id: 'post'
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        echo "Available storage after:"
        df -h
