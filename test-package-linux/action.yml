name: 'QIIME 2 Library Packaging - Test'
description: 'Test a conda package'

inputs:
  conda-activate:
    description: 'An activation script for the conda env to use'
    required: true
  package-path:
    description: 'The path to the .tar.bz2 to test'
    required: true
  channels:
    required: false
    description: "Channels to search for additional packages in"
    default: '["conda-forge", "bioconda"]'

runs:
  using: composite
  steps:
  - id: 'setup-path'
    shell: bash
    run: echo "$GITHUB_ACTION_PATH/bin/" >> $GITHUB_PATH

  - name: install firefox for selenium tests
    shell: bash
    run: |
      dnf -y install epel-release
      dnf -y install firefox

  - name: set env var to skip chrome-based selenium tests
    shell: bash
    run: |
      echo "SKIP_SELENIUM=1" >> $GITHUB_ENV

  - id: 'test-package'
    shell: bash
    env:
      PYTHONPATH: "$GITHUB_ACTION_PATH/../src/"
    run: |
      ${{ inputs.conda-activate }}
      export PYTHONPATH="$GITHUB_ACTION_PATH/../src${PYTHONPATH:+:$PYTHONPATH}"
      cat <<EOF | python "$GITHUB_ACTION_PATH/bin/test-package.py"
      ${{ toJSON(inputs) }}
      EOF

  - id: 'test-package2-electric-boogaloo'
    shell: bash
    env:
      PYTHONPATH: "$GITHUB_ACTION_PATH/../src/"
    run: |
      ${{ inputs.conda-activate }}
      export PYTHONPATH="$GITHUB_ACTION_PATH/../src${PYTHONPATH:+:$PYTHONPATH}"
      cat <<EOF | python "$GITHUB_ACTION_PATH/bin/test-package2-electric-boogaloo.py"
      ${{ toJSON(inputs) }}
      EOF
